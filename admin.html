<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1c1e24;
    --sub: #6b7280;
    --line: #e5e7eb;
    --input: #ffffff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --ok: #16a34a;
    --soft: #f3f4f6;
    --soft-hover: #e5e7eb;
    --softest: #f9fafb;
    --viewer-bg: rgba(255,255,255,.92);
    --panel-glass: rgba(255,255,255,.8);
  }
  html.dark {
    --bg: #111827;
    --panel: #1f2937;
    --text: #f3f4f6;
    --sub: #9ca3af;
    --line: #374151;
    --input: #111827;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #f87171;
    --ok: #4ade80;
    --soft: #374151;
    --soft-hover: #4b5563;
    --softest: #111827;
    --viewer-bg: rgba(0,0,0,.88);
    --panel-glass: rgba(31,41,55,.8);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }
  h1 { font-size: 18px; margin: 0 0 16px; font-weight: 600; }
  h2 { font-size: 14px; color: var(--sub); margin: 20px 0 8px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--input); color: var(--text); font-size: 14px; font-family: inherit; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 100px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); margin-top: 8px; }
  .check input { width: auto; accent-color: var(--accent); }
  button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: var(--panel); color: var(--text); font-size: 13px; font-weight: 500; transition: background-color .15s, border-color .15s, transform .1s; }
  button:hover { background: var(--soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:active { transform: scale(.98); }
  button.secondary { background: var(--soft); border-color: var(--line); color: var(--text); }
  button.secondary:hover { background: var(--soft-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { background: none; border: none; color: var(--accent); padding: 0; font-size: 12px; }
  button.link:hover { text-decoration: underline; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .msg { font-size: 14px; color: var(--sub); min-height: 20px; white-space: pre-wrap; margin-top: 12px; line-height: 1.5; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }

  .auth-box { max-width: 380px; margin: 60px auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tabs button { flex: 1; border: 1px solid var(--line); }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .center { text-align: center; margin-top: 14px; }

  .app-wrap { display: flex; flex-direction: column; min-height: 100vh; }
  
  .brand-bar { background: var(--panel); padding: 16px 20px 4px; font-size: 20px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; transition: padding .25s ease; }
  .brand-right { display: flex; align-items: center; gap: 12px; }
  .brand-bar .brand-name { font-size: 28px; transition: font-size .25s ease; }

  .status-dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .status-dot.bad { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  .topbar { background: var(--panel-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 5; }
  .topbar-left { display: flex; align-items: center; gap: 8px; flex: 1; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar button { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
  .topbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { padding: 20px; overflow-y: auto; }

  .provider-list { margin-top: 16px; }
  .provider-card { background: var(--softest); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
  .provider-tools { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .provider-tools button { padding: 4px 10px; font-size: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .stat-box { background: var(--softest); border: 1px solid var(--line); border-radius: 8px; padding: 12px 8px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; }

  .ratio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ratio-card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px 5px; text-align: center; cursor: pointer; background: var(--panel); transition: border-color .15s, background-color .15s; }

  .ratio-shape-wrap { height: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }

  .tier-chip:hover { border-color: var(--accent); }

  #genPrompt { max-height: 200px; overflow-y: auto; }
  .select-box-trigger.disabled { opacity: .45; cursor: not-allowed; }
  .ratio-card.active .ratio-shape { border-color: var(--accent); }

  select:has(option[value=""]:checked) { color: var(--sub); }

  .select-box { position: relative; }
  .select-box-trigger { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); color: var(--text); font-size: 14px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .select-box-trigger:hover { border-color: var(--accent); }
  .select-box-options { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 6px 6px; z-index: 10; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,.1); }
  .select-box-option { padding: 10px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 13px; }
  .select-box-option:last-child { border-bottom: none; }
  .select-box-option:hover { background: var(--soft); }
  .select-box-option.active { background: rgba(37, 99, 235, 0.1); color: var(--accent); font-weight: 500; }

  .ref-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .ref-grid:empty { display: none; }
  .ref-thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--soft); }

  .gallery { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: box-shadow .15s; }

  html.dark .card, html.dark .provider-card, html.dark .stat-box, html.dark .admin-user, html.dark .modal-box { box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #providerList.ios-group { background: var(--panel); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.08); }

  .stat-box { border: none; }
  .stat-box.tint-blue { background: rgba(37,99,235,.1); }
  .stat-box.tint-blue .stat-num { color: var(--accent); }
  .stat-box.tint-green { background: rgba(22,163,74,.1); }
  .stat-box.tint-green .stat-num { color: var(--ok); }
  .stat-box.tint-orange { background: rgba(234,88,12,.1); }
  .stat-box.tint-orange .stat-num { color: #ea580c; }
  .stat-box.tint-purple { background: rgba(147,51,234,.1); }
  .stat-box.tint-purple .stat-num { color: #9333ea; }
  .stat-box.tint-teal { background: rgba(13,148,136,.1); }
  .stat-box.tint-teal .stat-num { color: #0d9488; }
  html.dark .stat-box.tint-orange .stat-num { color: #fb923c; }
  html.dark .stat-box.tint-purple .stat-num { color: #c084fc; }

  .modal-head { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--sub); cursor: pointer; font-size: 20px; }

  .profile-section { text-align: center; margin-bottom: 24px; }
  .profile-avatar-display { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px; border: 2px solid var(--line); background-size: cover; background-position: center; }

    .topbar { flex-wrap: wrap; padding: 12px 16px; }
    .topbar-left { width: 100%; order: 1; }

</style>

<script>

const $ = id => document.getElementById(id);
function formatSize(n) {
  if (!n || n <= 0) return '0B';
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024 >= 100 ? Math.round(n / 1024) : (n / 1024).toFixed(1).replace(/\.0$/, '')) + 'KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1).replace(/\.0$/, '') + 'MB';
  return (n / 1024 / 1024 / 1024).toFixed(2).replace(/\.00$/, '') + 'GB';
}
function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
}
function setMsg(el, text, type = '') { el.textContent = text; el.className = 'msg' + (type ? ' ' + type : ''); }

// 安全日志折叠：点标题展开/收起，默认收起，状态记在本地
function toggleSecLog() {
  const list = $('adminSecurityList');
  const collapsed = list.classList.toggle('hidden');
  $('secLogArrow').textContent = collapsed ? '▸' : '▾';
  try { localStorage.setItem('admin-sec-log-collapsed', collapsed ? '1' : '0'); } catch (e) {}
}
(function initSecLogFold() {
  let collapsed = true;
  try { collapsed = localStorage.getItem('admin-sec-log-collapsed') !== '0'; } catch (e) {}
  const list = $('adminSecurityList');
  if (list) list.classList.toggle('hidden', collapsed);
  const arrow = $('secLogArrow');
  if (arrow) arrow.textContent = collapsed ? '▸' : '▾';
})();

let sb, currentUser, myRole = 'user', presenceChannel = null;

// 深色模式跟着主站走（存在本机）
if (localStorage.getItem('imggen-theme') === 'dark') document.documentElement.classList.add('dark');

// 安全日志：只有管理员能看，普通用户只能记自己的一行
async function logSecurity(action, detail = '') {
  if (!currentUser) return;
  try {
    await sb.from('security_log').insert({ user_id: currentUser.id, email: currentUser.email, action, detail });
  } catch (e) {}
}

async function getViewUrl(record) {
  if (record.image_url) return record.image_url;
  if (record.image_path && record.image_path.startsWith('r2:')) {
    try {
      const { data: { session } } = await sb.auth.getSession();
      const token = session ? session.access_token : '';
      return R2_WORKER_URL + '/image?key=' + encodeURIComponent(record.image_path.slice(3)) + (token ? '&token=' + token : '');
    } catch (e) { return ''; }
  }
  if (record.image_path) {
    try {
      const { data } = await sb.storage.from('images').createSignedUrl(record.image_path, SIGNED_URL_TTL);
      return data ? data.signedUrl : '';
    } catch (e) { return ''; }
  }
  return '';
}

async function loadAdmin() {
  if (myRole !== 'admin' && myRole !== 'super_admin') return;
  const { count: userCount } = await sb.from('profiles').select('id', { count: 'exact', head: true });
  $('statUsers').textContent = userCount ?? '—';
  const { count: totalGen } = await sb.from('generations').select('id', { count: 'exact', head: true });
  $('statTotal').textContent = totalGen ?? '—';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const { count: todayGen } = await sb.from('generations').select('id', { count: 'exact', head: true }).gte('created_at', today.toISOString());
  $('statToday').textContent = todayGen ?? '—';
  const { count: newUsers } = await sb.from('profiles').select('id', { count: 'exact', head: true }).gte('created_at', today.toISOString());
  $('statNewUsers').textContent = newUsers ?? '—';
  // 存储用量：R2 新图（r2: 开头）和 Supabase 旧图分开算；分页全量统计，超过 1000 张也不少算
  let r2Count = 0, r2Bytes = 0, oldCount = 0, oldBytes = 0, oldUnknown = 0;
  for (let from = 0; ; from += 1000) {
    const { data: page } = await sb.from('generations').select('image_path, file_size_bytes').range(from, from + 999);
    if (!page || !page.length) break;
    page.forEach(g => {
      const isR2 = g.image_path && g.image_path.startsWith('r2:');
      if (isR2) { r2Count++; r2Bytes += g.file_size_bytes || 0; }
      else { oldCount++; if (g.file_size_bytes) oldBytes += g.file_size_bytes; else oldUnknown++; }
    });
    if (page.length < 1000) break;
  }
  $('statR2Size').textContent = formatSize(r2Bytes);
  $('statR2Label').textContent = `R2 存储用量 · ${r2Count} 张`;
  $('storageOld').textContent = `Supabase 旧图：${oldCount} 张，共 ${formatSize(oldBytes)}${oldUnknown ? `（${oldUnknown} 张无大小记录）` : ''}；R2 免费额度 10GB`;
  const { data: maint } = await sb.from('site_settings').select('value').eq('key', 'maintenance').maybeSingle();
  const maintOn = !!(maint && maint.value === 'on');
  $('maintState').textContent = maintOn ? '维护中' : '正常';
  $('maintToggleBtn').textContent = maintOn ? '关闭维护' : '开启维护';
  const onlineEl = $('statOnline');
  if (onlineEl && presenceChannel) onlineEl.textContent = Object.keys(presenceChannel.presenceState()).length;

  const { data: users, error: usersErr } = await sb.from('profiles').select('id, email, role, created_at').order('created_at', { ascending: true });
  if (usersErr) setMsg($('gateMsg'), '用户列表加载失败，其他部分照常显示', 'error');
  const list = $('adminUserList');
  list.innerHTML = '';
  (users || []).forEach(u => {
    const row = document.createElement('div');
    row.className = 'admin-user';
    const isSelf = u.id === currentUser.id;
    const roleName = u.role === 'super_admin' ? '最高管理者' : u.role === 'admin' ? '管理员' : '用户';
    row.innerHTML = `
      <div class="row1">
        <div><strong>${escapeHtml(u.email || u.id.slice(0, 8))}</strong> <span class="role-badge ${escapeHtml(u.role)}">${roleName}</span></div>
        ${myRole === 'super_admin' && !isSelf && u.role !== 'super_admin' ? `<select class="role-select" title="下发权限">
          <option value="user"${u.role === 'user' ? ' selected' : ''}>用户</option>
          <option value="admin"${u.role === 'admin' ? ' selected' : ''}>管理员</option>
        </select>` : ''}
      </div>
      <div style="color: var(--sub); margin-top: 4px;">注册：${new Date(u.created_at).toLocaleString()} · 生图：<span class="gen-count">…</span> 张</div>
      <div style="margin-top: 6px;"><button class="secondary show-gens">生图记录</button></div>
      <div class="admin-gens hidden"></div>`;
    list.append(row);
    sb.from('generations').select('id', { count: 'exact', head: true }).eq('user_id', u.id).then(({ count }) => {
      const el = row.querySelector('.gen-count');
      if (el) el.textContent = count ?? 0;
    });
    const sel = row.querySelector('.role-select');
    if (sel) sel.onchange = async () => {
      const { error } = await sb.from('profiles').update({ role: sel.value }).eq('id', u.id);
      if (error) { setMsg($('gateMsg'), '权限下发失败', 'error'); sel.value = u.role; return; }
      logSecurity('role_change', (u.email || '') + ' → ' + (sel.value === 'admin' ? '管理员' : '用户'));
      setMsg($('gateMsg'), '已把 ' + (u.email || '') + ' 设为' + (sel.value === 'admin' ? '管理员' : '用户'), 'ok');
      loadAdmin();
    };
    const btn = row.querySelector('.show-gens');
    const box = row.querySelector('.admin-gens');
    btn.onclick = async () => {
      if (!box.classList.contains('hidden')) { box.classList.add('hidden'); btn.textContent = '生图记录'; return; }
      btn.textContent = '加载中…';
      const { data: gens } = await sb.from('generations').select('id, prompt, model, size, image_path, image_url, created_at').eq('user_id', u.id).order('created_at', { ascending: false }).limit(20);
      box.innerHTML = '';
      if (!gens || gens.length === 0) box.innerHTML = '<div style="color: var(--sub); padding: 6px 0;">还没有生图记录</div>';
      for (const g of gens || []) {
        const url = await getViewUrl(g);
        const item = document.createElement('div');
        item.style.cssText = 'margin-top: 8px;';
        item.innerHTML = `<div style="font-size: 12px; color: var(--sub);">${escapeHtml(g.model || '')} · ${escapeHtml(g.size || '')} · ${new Date(g.created_at).toLocaleString()}</div><div style="font-size: 12px; margin: 2px 0;">${escapeHtml(g.prompt || '')}</div>`;
        if (url) {
          const im = document.createElement('img');
          im.src = url;
          im.onclick = () => window.open(url, '_blank');
          item.prepend(im);
        }
        box.append(item);
      }
      box.classList.remove('hidden');
      btn.textContent = '收起记录';
    };
  });

  // 安全日志（最新 50 条）
  const secBox = $('adminSecurityList');
  try {
    const { data: secs, error: secErr } = await sb.from('security_log').select('email, action, detail, created_at').order('created_at', { ascending: false }).limit(50);
    if (secErr) throw secErr;
    secBox.innerHTML = '';
    const secName = { admin_attempt: '试图进后台', admin_open: '进入后台', role_change: '改角色', mfa_enroll: '开启二次验证', mfa_unenroll: '关闭二次验证', mfa_fail: '二次验证失败', login: '登录' };
    (secs || []).forEach(a => {
      const d = document.createElement('div');
      d.className = 'admin-act';
      d.textContent = `${new Date(a.created_at).toLocaleString()} · ${a.email || ''} · ${secName[a.action] || a.action}${a.detail ? ' · ' + a.detail : ''}`;
      secBox.append(d);
    });
    if (!secs || secs.length === 0) secBox.innerHTML = '<div style="color: var(--sub);">暂无安全记录</div>';
  } catch (e) {
    secBox.innerHTML = '<div style="color: var(--sub);">安全日志表还没建好（等 SQL 跑完就有了）</div>';
  }

  const { data: acts } = await sb.from('activity_log').select('email, action, detail, created_at').order('created_at', { ascending: false }).limit(50);
  const actBox = $('adminActivityList');
  actBox.innerHTML = '';
  const actionName = { login: '登录', generate: '生图', delete: '删除' };
  (acts || []).forEach(a => {
    const d = document.createElement('div');
    d.className = 'admin-act';
    d.textContent = `${new Date(a.created_at).toLocaleString()} · ${a.email || ''} · ${actionName[a.action] || a.action}${a.detail ? ' · ' + a.detail : ''}`;
    actBox.append(d);
  });
  if (!acts || acts.length === 0) actBox.innerHTML = '<div style="color: var(--sub);">暂无操作记录</div>';

  // 意见反馈（最新 50 条）
  const fbBox = $('adminFeedbackList');
  try {
    const { data: fbs, error: fbErr } = await sb.from('feedback').select('id, email, content, created_at').order('created_at', { ascending: false }).limit(50);
    if (fbErr) throw fbErr;
    fbBox.innerHTML = '';
    (fbs || []).forEach(f => {
      const d = document.createElement('div');
      d.className = 'admin-act';
      d.innerHTML = `<div>${new Date(f.created_at).toLocaleString()} · ${escapeHtml(f.email || '')}</div><div style="margin-top: 2px;">${escapeHtml(f.content || '')}</div>`;
      const del = document.createElement('button');
      del.className = 'link';
      del.textContent = '删除';
      del.onclick = async () => {
        if (!confirm('确定删除这条反馈吗？')) return;
        const { error } = await sb.from('feedback').delete().eq('id', f.id);
        if (error) { setMsg($('gateMsg'), '删除失败', 'error'); return; }
        d.remove();
      };
      d.append(del);
      fbBox.append(d);
    });
    if (!fbs || fbs.length === 0) fbBox.innerHTML = '<div style="color: var(--sub);">暂无反馈</div>';
  } catch (e) {
    fbBox.innerHTML = '<div style="color: var(--sub);">反馈表还没建好（等 SQL 跑完就有了）</div>';
  }
}

$('adminRefreshBtn').onclick = () => loadAdmin();
$('maintToggleBtn').onclick = async () => {
  const btn = $('maintToggleBtn');
  btn.disabled = true;
  try {
    const { data: cur } = await sb.from('site_settings').select('value').eq('key', 'maintenance').maybeSingle();
    const next = (cur && cur.value === 'on') ? 'off' : 'on';
    const { error } = await sb.from('site_settings').upsert({ key: 'maintenance', value: next });
    if (error) throw error;
    logSecurity(next === 'on' ? 'maintenance_on' : 'maintenance_off', '');
    loadAdmin();
  } catch (e) {
    setMsg($('gateMsg'), '切换失败：' + (e.message || e), 'error');
  } finally {
    btn.disabled = false;
  }
};

// 入口守门：没登录 → 请先登录；登录了但不是管理员 → 记一笔并挡住
(async () => {
  if (!window.supabase) { setMsg($('gateMsg'), 'Supabase 加载失败', 'error'); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) { setMsg($('gateMsg'), '请先在绘乐坊登录，再打开本页。', 'error'); return; }
  currentUser = session.user;
  try {
    const { data } = await sb.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
    myRole = data?.role || 'user';
  } catch (e) { myRole = 'user'; }
  if (myRole !== 'admin' && myRole !== 'super_admin') {
    setMsg($('gateMsg'), '没有管理权限', 'error');
    logSecurity('admin_attempt', '直接打开 admin.html');
    return;
  }
  logSecurity('admin_open', '');
  $('adminBody').classList.remove('hidden');
  presenceChannel = sb.channel('online-users', { config: { presence: { key: currentUser.id } } });
  presenceChannel.on('presence', { event: 'sync' }, () => {
    const el = $('statOnline');
    if (el) el.textContent = Object.keys(presenceChannel.presenceState()).length;
  });
  presenceChannel.subscribe(async (status) => {
    if (status === 'SUBSCRIBED') {
      try { await presenceChannel.track({ online_at: new Date().toISOString() }); } catch (e) {}
    }
  });
  loadAdmin();
})();
</script>

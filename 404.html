<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="refresh" content="5; url=index.html">
<title>页面找不到了 - 绘乐坊</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root { --bg:#f5f6f8; --panel:#ffffff; --text:#1c1e24; --sub:#6b7280; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; text-align:center; }
  .box { max-width:420px; }
  .code { font-size:72px; font-weight:700; color:var(--sub); line-height:1; }
  h1 { font-size:20px; margin:16px 0 8px; }
  p { color:var(--sub); font-size:15px; line-height:1.8; margin:8px 0; }
  a.btn { display:inline-block; margin-top:16px; padding:10px 24px; background:var(--accent); color:#fff; border-radius:999px; text-decoration:none; font-size:15px; }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>页面找不到了</h1>
  <p>你访问的页面不存在，或者地址输错了。<br>5 秒后自动回绘乐坊首页。</p>
  <a class="btn" href="index.html">回绘乐坊首页</a>
</div>
</body>
</html>
